<!DOCTYPE html>
<html>
<head>
<title>ByteXL Navbar</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
}

.navbar {
    height: 105px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    border-bottom: 1px solid #ddd;
}

.logo {
    color: #219653;
    font-size: 30px;
    font-weight: bold;
}

.links {
    display: flex;
    gap: 40px;
}

.links a, .subjects a {
    text-decoration: none;
    color: #263746;
    font-weight: bold;
}

.signin {
    background: #243540;
    color: white;
    padding: 13px 25px;
    border-radius: 9px;
    text-decoration: none;
}

.subjects {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    border-bottom: 1px solid #ddd;
}

.subjects a {
    font-size: 16px;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">ByteXL</div>

    <div class="links">
        <a href="#">Courses</a>
        <a href="#">Tutorials</a>
        <a href="#">Practice</a>
        <a href="#">Jobs</a>
    </div>

    <a href="#" class="signin">Sign In</a>
</div>

<div class="subjects">
    <a href="#">DSA</a>
    <a href="#">Practice Problems</a>
    <a href="#">C</a>
    <a href="#">C++</a>
    <a href="#">Java</a>
    <a href="#">Python</a>
    <a href="#">JavaScript</a>
    <a href="#">Data Science</a>
    <a href="#">Machine Learning</a>
    <a href="#">Courses</a>
    <a href="#">Linux</a>
    <a href="#">DevOps</a>
</div>

</body>
</html>
